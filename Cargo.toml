[workspace]
resolver = "2"
members = [
    "crates/modron-core",
    "crates/modron-providers",
    "crates/modron-tools",
    "crates/modron-store",
    "crates/modron-router",
    "crates/modron-tui",
    "crates/modron-mcp",
    "crates/modron-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
modron-core = { path = "crates/modron-core" }
modron-providers = { path = "crates/modron-providers" }
modron-tools = { path = "crates/modron-tools" }
modron-store = { path = "crates/modron-store" }
modron-router = { path = "crates/modron-router" }
modron-tui = { path = "crates/modron-tui" }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "process", "io-util", "io-std", "sync", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
ignore = "0.4"
walkdir = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
dirs = "5"
futures = "0.3"
tempfile = "3"
ratatui = "0.30"
sha2 = "0.10"
crossterm = "0.29"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"
strip = true
