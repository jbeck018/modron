# cargo-deny — supply-chain hardening (pi's lesson: exact pins, audited
# sources). CI runs `cargo deny check` on every push.

[advisories]
version = 2
yanked = "deny"
# Unmaintained (NOT vulnerable) advisories pulled in by the gpui-kit
# desktop stack (0.9.1) and its Linux accessibility/dbus/text deps; each
# is upstream's dependency, not ours. Re-check on the next gpui-kit
# release.
ignore = [
  "RUSTSEC-2024-0384", # instant -> web-time (gpui-base)
  "RUSTSEC-2024-0436", # paste (gpui proc-macro stack)
  "RUSTSEC-2025-0134", # rustls-pemfile (gpui-component)
  "RUSTSEC-2026-0192", # ttf-parser (usvg/gpui text stack)
  "RUSTSEC-2026-0206", # rustybuzz (usvg/gpui text stack)
  "RUSTSEC-2026-0370", # zvariant (atspi/oo7 linux a11y, merged into zbus)
  "RUSTSEC-2026-0371", # zbus_names (same linux a11y path)
  "RUSTSEC-2026-0372", # zvariant_derive (same linux a11y path)
]

[licenses]
version = 2
# Permissive licenses only; anything else fails the build deliberately.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "0BSD",
  "CC0-1.0",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  "MPL-2.0",        # weak copyleft, library-only (option-ext); fine for a
                    # binary that does not statically embed MPL source
]

[bans]
multiple-versions = "warn"
# Path deps between our own workspace crates are version-less by design —
# that is how Cargo expresses "always the workspace member", not a wildcard.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
