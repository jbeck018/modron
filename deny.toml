# cargo-deny — supply-chain hardening (pi's lesson: exact pins, audited
# sources). CI runs `cargo deny check` on every push.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licenses only; anything else fails the build deliberately.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  "MPL-2.0",        # weak copyleft, library-only (option-ext); fine for a
                    # binary that does not statically embed MPL source
]

[bans]
multiple-versions = "warn"
# Path deps between our own workspace crates are version-less by design —
# that is how Cargo expresses "always the workspace member", not a wildcard.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
