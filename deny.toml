# cargo-deny — supply-chain hardening (pi's lesson: exact pins, audited
# sources). CI runs `cargo deny check` on every push.

[advisories]
version = 2
yanked = "deny"
ignore = [
  # chrono declared unmaintained on 2026-11 (all versions, no safe upgrade).
  # It is not a vulnerability. chrono's DateTime is in the persisted session
  # format (modron-types), so leaving it is a migration to jiff or time, not
  # a version bump. Tracked in LEDGER.md (row DEP-1); remove this entry when
  # that lands.
  { id = "RUSTSEC-2026-0543", reason = "unmaintained, no fix available; migration tracked as DEP-1" },
]

[licenses]
version = 2
# Permissive licenses only; anything else fails the build deliberately.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "0BSD",
  "CC0-1.0",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  "MPL-2.0",        # weak copyleft, library-only (option-ext); fine for a
                    # binary that does not statically embed MPL source
]

[bans]
multiple-versions = "warn"
# Path deps between our own workspace crates are version-less by design —
# that is how Cargo expresses "always the workspace member", not a wildcard.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
