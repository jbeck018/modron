[package]
name = "modron-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
futures.workspace = true
# OAuth device/browser flows (modron_core::auth::oauth) — shared by the
# CLI `auth login` command and the TUI's interactive flow. Already linked
# into the binary via modron-providers.
reqwest.workspace = true
sha2.workspace = true
# Real dependency (not dev): hooks (H1) spawn hook processes with timeouts,
# matching the providers-crate precedent for retry backoff.
tokio.workspace = true
# PNG encoder for bitmap context compaction (bitmap_compact.rs): a pruned
# transcript rendered as one pixel-font image a vision model reads in ~1-2k
# tokens. Pure Rust, no system libpng.
png = "0.17"

[dev-dependencies]
tokio.workspace = true
tempfile.workspace = true
