[package]
name = "modron-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
modron-core = { path = "../modron-core", version = "0.1.0" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tokio.workspace = true
regex.workspace = true
ignore.workspace = true
walkdir.workspace = true

# Code intelligence (Phase 14): exact syntax-aware skeletons. The scanner
# fallback stays for every language without a bundled grammar.
tree-sitter = { version = "0.25.10", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-go = { version = "0.25", optional = true }

[features]
default = ["semantic"]
semantic = [
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-python",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-go",
]

[dev-dependencies]
tempfile.workspace = true
