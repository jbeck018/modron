[package]
name = "nsh-app-modron-remote"
version = "0.1.0"
edition = "2024"
publish = false

# Its own workspace root: the nsh app builds outside the modron workspace
# (mobile/rust-core joins it as a path dependency instead).
[workspace]

[dependencies]
nsh-core = "0.4.0"
nsh-base = "0.4.0"
modron-mobile-core = { path = "../rust-core", version = "0.1.0" }
modron-types = { path = "../../crates/modron-types", version = "0.1.0" }
modron-protocol = { path = "../../crates/modron-protocol", version = "0.1.0" }
modron-view = { path = "../../crates/modron-view", version = "0.1.0" }
uuid = { version = "1", features = ["v4", "serde"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["js"] }
