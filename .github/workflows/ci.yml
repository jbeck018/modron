name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test + clippy + fmt (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      # modron-desktop (gpui) needs Linux GUI system libs the runner does
      # not ship; the macOS job covers the desktop crate, Linux covers the
      # headless workspace (server/protocol/view/TUI/mobile-core).
      - name: Clippy
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            cargo clippy --workspace --exclude modron-desktop --all-targets -- -D warnings
          else
            cargo clippy --workspace --all-targets -- -D warnings
          fi
      - name: Tests (offline — the mock provider is the acceptance harness)
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            cargo test --workspace --exclude modron-desktop
          else
            cargo test --workspace
          fi
      - name: Startup performance gate (the ~6ms promise — fails above 50ms)
        if: matrix.os == 'macos-latest'
        run: |
          cargo build --release
          cat > /tmp/startup_gate.py <<'PY'
          import subprocess, time
          times = []
          for _ in range(10):
              t0 = time.perf_counter()
              subprocess.run(['target/release/modron', '--version'], capture_output=True)
              times.append((time.perf_counter() - t0) * 1000)
          times.sort()
          print(f'{times[5]:.0f}')
          PY
          STARTUP=$(python3 /tmp/startup_gate.py)
          echo "startup p50: ${STARTUP}ms"
          if [ "$STARTUP" -gt 50 ]; then
            echo "::error::startup regression: ${STARTUP}ms > 50ms budget"
            exit 1
          fi

  deny:
    name: supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny || cargo install cargo-deny
      - name: cargo-deny check (advisories, licenses, bans, sources)
        run: cargo deny check

  release-binary:
    name: release binary (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p modron-cli
      - name: Binary size (keep it honest — PLAN §"lightweight")
        run: ls -lh target/${{ matrix.target }}/release/modron
      - uses: actions/upload-artifact@v4
        with:
          name: modron-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/modron
