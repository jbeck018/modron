name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Same-ref pushes/PRs supersede each other. NOTE: a GitHub-hosted runner
# loss (macOS capacity, spot reclamation) also cancels the run — that
# needs a manual re-run; we deliberately do NOT vendor a retry action.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test + clippy + fmt (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Format check
        run: cargo fmt --all --check
      # modron-desktop (gpui) needs Linux GUI system libs the runner does
      # not ship; the macOS job covers the desktop crate, Linux covers the
      # headless workspace (server/protocol/view/TUI/mobile-core).
      - name: Clippy
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          if [ "$MATRIX_OS" = "ubuntu-latest" ]; then
            cargo clippy --workspace --exclude modron-desktop --all-targets -- -D warnings
          else
            cargo clippy --workspace --all-targets -- -D warnings
          fi
      - name: Tests (offline — the mock provider is the acceptance harness)
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          if [ "$MATRIX_OS" = "ubuntu-latest" ]; then
            cargo test --workspace --exclude modron-desktop
          else
            cargo test --workspace
          fi
      - name: Startup performance gate (the ~6ms promise — fails above 50ms)
        if: matrix.os == 'macos-latest'
        run: |
          cargo build --release -p modron-cli
          cat > /tmp/startup_gate.py <<'PY'
          import subprocess, time
          times = []
          for _ in range(10):
              t0 = time.perf_counter()
              subprocess.run(['target/release/modron', '--version'], capture_output=True)
              times.append((time.perf_counter() - t0) * 1000)
          times.sort()
          print(f'{times[5]:.0f}')
          PY
          STARTUP=$(python3 /tmp/startup_gate.py)
          echo "startup p50: ${STARTUP}ms"
          if [ "$STARTUP" -gt 50 ]; then
            echo "::error::startup regression: ${STARTUP}ms > 50ms budget"
            exit 1
          fi

  deny:
    name: supply chain (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2
        with:
          tool: cargo-deny
      - name: cargo-deny check (advisories, licenses, bans, sources)
        run: cargo deny check

  release-binary:
    name: release binary (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.target }}
      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET" -p modron-cli
      - name: Binary size (keep it honest — PLAN §"lightweight")
        env:
          TARGET: ${{ matrix.target }}
        run: ls -lh "target/$TARGET/release/modron"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: modron-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/modron
