name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Same-ref pushes/PRs supersede each other. NOTE: a GitHub-hosted runner
# loss (macOS capacity, spot reclamation) also cancels the run — that
# needs a manual re-run; we deliberately do NOT vendor a retry action.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: NSH app (terminal target + web bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      # A C dependency is compiled for wasm32: cc-rs needs clang and an
      # unversioned llvm-ar, which the runner image does not provide.
      - name: Install clang and llvm (wasm32 C toolchain)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang llvm
      - name: Web target type-check
        run: cargo check --lib --target wasm32-unknown-unknown
      # release.yml builds the app with --locked; CI's runs do not, so check
      # that app/Cargo.lock is current without building anything.
      - name: Lockfile is current (release builds use --locked)
        run: cargo metadata --locked --format-version 1 > /dev/null

      # Web bundle and browser tests (app/README.md, "Web bundle" and "Tests").
      # wasm-bindgen is cached by its pinned version; the Rust build cache is
      # the rust-cache step above.
      - name: Cache wasm-bindgen CLI 0.2.130
        id: wasm-bindgen-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.130-${{ runner.os }}
      - name: Install wasm-bindgen CLI 0.2.130
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Check wasm-bindgen version
        run: wasm-bindgen --version | grep -q '0.2.130'
      # The installer has no documented version pin; the version check below
      # fails the job if it installs anything other than 0.6.0.
      - name: Install NSH CLI (nsh.dev installer)
        run: |
          curl -fsSL https://nsh.dev/install.sh | NSH_VERSION=v0.6.0 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check NSH CLI version (0.6.0)
        run: nsh --version | grep -q '0\.6\.0'
      - name: Build web bundle (nsh package --target web)
        run: nsh package --target web -o dist < /dev/null
      # web-test.js does require('playwright') with no package in app/, so
      # Playwright is installed beside it and found through NODE_PATH.
      - name: Install Playwright 1.63.0 and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" playwright@1.63.0
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/playwright/node_modules" >> "$GITHUB_ENV"
      - name: Browser tests (web-test.js)
        run: node web-test.js

  # End-to-end suite (e2e/README.md): real `modron serve` (mock provider) ->
  # real bridge Worker under `wrangler dev --local` -> the web bundle in
  # headless Chromium, plus the terminal app under a pty (T1-T4b).
  # Self-contained on purpose: the app job uploads no artifacts, so sharing
  # its build would need upload/download plumbing, and this job's cost is
  # the same build steps the app job runs, not a second copy of the suite.
  e2e:
    name: end-to-end suite (local bridge, serve, web, terminal)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      # One cache step for both workspaces (root and app/, separate lockfiles).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            .
            app
      # Dev profile, like a local `cargo build`: the suite runs these binaries.
      - name: Build modron (serve, CLI)
        run: cargo build -p modron-cli --bin modron
      - name: Build modron-app-tui (terminal target)
        working-directory: app
        run: cargo build --bin modron-app-tui
      # Web bundle: the same steps as the app job, verbatim.
      - name: Install clang and llvm (wasm32 C toolchain)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang llvm
      - name: Cache wasm-bindgen CLI 0.2.130
        id: wasm-bindgen-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.130-${{ runner.os }}
      - name: Install wasm-bindgen CLI 0.2.130
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Check wasm-bindgen version
        run: wasm-bindgen --version | grep -q '0.2.130'
      - name: Install NSH CLI (nsh.dev installer)
        run: |
          curl -fsSL https://nsh.dev/install.sh | NSH_VERSION=v0.6.0 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check NSH CLI version (0.6.0)
        run: nsh --version | grep -q '0\.6\.0'
      - name: Build web bundle (nsh package --target web)
        working-directory: app
        run: nsh package --target web -o dist < /dev/null
      # Staging layout the suite reads (e2e/lib.mjs: E2E_MODRON and
      # E2E_APP_SRC default to <E2E_SCRATCH>/modron and <E2E_SCRATCH>/app).
      # The short root keeps the modron daemon socket path under 108 bytes:
      # $RUNNER_TEMP is /home/runner/work/_temp, so the longest socket
      # (.../e2e/run-XXXXXX/h-p7-nohost/.modron/daemon.sock) is about 72 bytes.
      - name: Stage modron binary and web bundle
        run: |
          stage="$RUNNER_TEMP/e2e"
          rm -rf "$stage"
          mkdir -p "$stage/app"
          cp target/debug/modron "$stage/modron"
          cp -R app/dist/Modron/. "$stage/app/"
          test -x "$stage/modron"
          test -f "$stage/app/index.html"
      # Node 22: the suite uses its built-in WebSocket global (same pin as cloud-deploy.yml).
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      # cloud/bridge: wrangler 4 from the lockfile. `wrangler dev --local` needs
      # no Cloudflare account; the suite sets CI=1 and WRANGLER_SEND_METRICS=false.
      - name: Install bridge dependencies (wrangler)
        working-directory: cloud/bridge
        run: npm ci
      # Playwright and Chromium as the app job does. NODE_PATH lets
      # e2e/lib.mjs `require('playwright')` resolve (createRequire honours it).
      - name: Install Playwright 1.63.0 and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" playwright@1.63.0
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/playwright/node_modules" >> "$GITHUB_ENV"
      # pyte is pure Python; E2E_PYTE_DIR is the directory put on sys.path, so
      # the package sits directly in it (--target), not in a site-packages tree.
      - name: Install pyte 0.8.2 (terminal emulator for T1-T4b)
        run: python3 -m pip install --target "$RUNNER_TEMP/pyte" pyte==0.8.2
      - name: Run end-to-end suite
        env:
          E2E_SCRATCH: ${{ runner.temp }}/e2e
          E2E_PYTE_DIR: ${{ runner.temp }}/pyte
          # A skipped step (for example a stale terminal binary) fails the job.
          E2E_NO_SKIP: '1'
        run: node e2e/run.mjs
      # Results, evidence-<id>.json, serve and bridge logs, screenshots. Only
      # those file types: the run directories also hold Unix sockets and the
      # wrangler state, which artifact upload should not walk.
      - name: Upload suite results and logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-results-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ runner.temp }}/e2e/run-*/**/*.json
            ${{ runner.temp }}/e2e/run-*/**/*.log
            ${{ runner.temp }}/e2e/run-*/**/*.png

  test:
    name: test + clippy + fmt (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (offline — the mock provider is the acceptance harness)
        run: cargo test --workspace
      - name: Startup performance gate (the ~6ms promise — fails above 50ms)
        if: matrix.os == 'macos-latest'
        run: |
          cargo build --release -p modron-cli
          cat > /tmp/startup_gate.py <<'PY'
          import subprocess, time
          times = []
          for _ in range(10):
              t0 = time.perf_counter()
              subprocess.run(['target/release/modron', '--version'], capture_output=True)
              times.append((time.perf_counter() - t0) * 1000)
          times.sort()
          print(f'{times[5]:.0f}')
          PY
          STARTUP=$(python3 /tmp/startup_gate.py)
          echo "startup p50: ${STARTUP}ms"
          if [ "$STARTUP" -gt 50 ]; then
            echo "::error::startup regression: ${STARTUP}ms > 50ms budget"
            exit 1
          fi

  deny:
    name: supply chain (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2
        with:
          tool: cargo-deny
      - name: cargo-deny check (advisories, licenses, bans, sources)
        run: cargo deny check

  release-binary:
    name: release binary (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.target }}
      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET" -p modron-cli
      - name: Binary size (keep it honest — PLAN §"lightweight")
        env:
          TARGET: ${{ matrix.target }}
        run: ls -lh "target/$TARGET/release/modron"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: modron-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/modron
