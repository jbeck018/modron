name: Cloud container deploy

# Manual only: nothing here runs on push or on a schedule. It builds the
# modron cloud image from the repo root as a gate, then deploys the Worker
# and Container in cloud/container/ into the Cloudflare account whose
# credentials are repository secrets. See cloud/container/README.md.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment name. Deploys the Worker modron-container-<name> (a-z, 0-9, dashes; max 32)."
        required: true
        default: preview
        type: string
      confirm:
        description: "Type the word deploy to confirm."
        required: true
        type: string

# Read-only by default. Nothing here writes to the repository.
permissions:
  contents: read

# One deploy per deployment name at a time. A running deploy is never
# cancelled half-way (that could leave the Worker and its secrets out of step).
concurrency:
  group: cloud-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  guard:
    name: check inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CONFIRM: ${{ inputs.confirm }}
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - name: Validate inputs
        run: |
          if [ "$CONFIRM" != "deploy" ]; then
            echo "::error::confirm must be exactly the word deploy"
            exit 1
          fi
          if ! printf '%s' "$ENVIRONMENT" | grep -Eq '^[a-z0-9-]{1,32}$'; then
            echo "::error::environment must match [a-z0-9-]{1,32}"
            exit 1
          fi

  # Gate: the image must build from the repo root with the committed
  # Dockerfile before anything is deployed. No secrets are used here.
  build:
    name: build image (gate)
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build modron-cloud from the repo root
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: cloud/container/Dockerfile
          push: false
          load: true
          tags: modron-cloud:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy Worker and Container (${{ inputs.environment }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: modron-container-${{ inputs.environment }}
      # Runtime secrets, read by the step below. Unset repository secrets
      # become empty and that secret is skipped with a notice.
      SECRET_BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
      # Repository secret names cannot start with GITHUB_, hence CLOUD_.
      SECRET_GITHUB_REPO: ${{ secrets.CLOUD_GITHUB_REPO }}
      SECRET_GITHUB_TOKEN: ${{ secrets.CLOUD_GITHUB_TOKEN }}
      SECRET_MODRON_HOST_TOKEN: ${{ secrets.MODRON_HOST_TOKEN }}
      SECRET_WAKE_TOKEN: ${{ secrets.WAKE_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Check Cloudflare credentials are set
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v:-}" ]; then
              echo "::error::repository secret $v is not set"
              exit 1
            fi
          done
      # Wrangler is pinned to the version cloud/bridge uses.
      - name: Deploy Worker and Container
        working-directory: cloud/container
        run: npx --yes wrangler@4.160.0 deploy --name "$WORKER_NAME"
      # Values go to wrangler on stdin only. They never appear on a command
      # line, and wrangler's output is discarded.
      - name: Set runtime secrets
        working-directory: cloud/container
        run: |
          set -eu
          for name in BRIDGE_URL GITHUB_REPO GITHUB_TOKEN MODRON_HOST_TOKEN WAKE_TOKEN; do
            var="SECRET_$name"
            value="${!var:-}"
            if [ -z "$value" ]; then
              echo "::notice::secret $name is not set in repository secrets: skipped"
              continue
            fi
            printf '%s' "$value" | npx --yes wrangler@4.160.0 secret put "$name" --name "$WORKER_NAME" >/dev/null
            echo "set $name on $WORKER_NAME"
          done
      - name: Summary
        run: |
          {
            echo "### Deployed $WORKER_NAME"
            echo "Runtime secrets were set from repository secrets; unset ones were skipped (see notices)."
          } >> "$GITHUB_STEP_SUMMARY"
