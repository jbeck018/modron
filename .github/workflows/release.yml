name: Release

# Two ways in: pushing a v* tag, or starting the workflow by hand on main with
# the version to publish. A manual run creates the tag itself (on the commit it
# runs on) when it creates the release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to publish, e.g. v0.1.3. Must equal the workspace version in Cargo.toml."
        required: true
        type: string
      confirm:
        description: "Type the word release to confirm."
        required: true
        type: string

env:
  # The tag this run publishes: the manual input, or the pushed tag.
  RELEASE_TAG: ${{ inputs.version || github.ref_name }}

# Default: read-only. Only the jobs that upload release assets get write.
permissions:
  contents: read

jobs:
  # Publish gate: the offline suite (mock provider is the acceptance
  # harness) must pass before any binary is built or published.
  test:
    name: offline tests (release gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # The tag must be a plain version, must equal the workspace version (so
      # `modron --version` matches the release), and a manual run must be on
      # main with the confirmation word.
      - name: Check the release tag
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag must look like v1.2.3, got $RELEASE_TAG"; exit 1
          fi
          WANT="v$(grep -m1 -E '^version = "' Cargo.toml | cut -d'"' -f2)"
          if [ "$RELEASE_TAG" != "$WANT" ]; then
            echo "::error::tag $RELEASE_TAG does not match the workspace version $WANT"; exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$CONFIRM" != "release" ]; then
              echo "::error::confirm must be exactly the word release"; exit 1
            fi
            if [ "$REF" != "refs/heads/main" ]; then
              echo "::error::a manual release runs on main, not $REF"; exit 1
            fi
          fi
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-gate
      - name: Tests (offline — the mock provider is the acceptance harness)
        run: cargo test --workspace

  build:
    name: build ${{ matrix.target }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # install.sh expects modron-<arch>-<os>.tar.gz archives containing
          # `modron` and `modron-app-tui` — keep names in sync with install.sh.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_os: unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_os: apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.target }}
      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET" -p modron-cli
      # The terminal app is its own workspace (app/). Same pinned toolchain,
      # separate cache. A failure here fails the job before any archive.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app
          key: release-app-${{ matrix.target }}
      - name: Build terminal app (modron-app-tui)
        run: cargo build --release --locked --manifest-path app/Cargo.toml --bin modron-app-tui
      - name: Package (modron-<arch>-<os>.tar.gz with `modron` and `modron-app-tui`)
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p stage
          cp "target/$TARGET/release/modron" stage/modron
          cp app/target/release/modron-app-tui stage/modron-app-tui
          ARCHIVE="modron-$TARGET.tar.gz"
          tar -czf "$ARCHIVE" -C stage modron modron-app-tui
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          cat "$ARCHIVE.sha256"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
      - name: Create release and upload archive + per-archive sha256
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # On a manual run the tag does not exist yet: the release creates it
          # on this run's commit.
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          generate_release_notes: true

  # Combined checksum manifest over the finished release's archives,
  # uploaded both as a workflow artifact and onto the release itself.
  checksums:
    name: SHA256SUMS manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download release archives
        run: |
          mkdir -p assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'modron-*.tar.gz' \
            --dir assets
      - name: Generate SHA256SUMS
        run: |
          cd assets
          shasum -a 256 modron-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SHA256SUMS
          path: assets/SHA256SUMS
      - name: Attach SHA256SUMS to the release
        # --repo: this job has no checkout, and gh otherwise asks git for the
        # repository.
        run: gh release upload "$RELEASE_TAG" assets/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
