name: Release

on:
  push:
    tags: ["v*"]

# Default: read-only. Only the jobs that upload release assets get write.
permissions:
  contents: read

jobs:
  # Publish gate: the offline suite (mock provider is the acceptance
  # harness) must pass before any binary is built or published.
  test:
    name: offline tests (release gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-gate
      - name: Tests (offline — the mock provider is the acceptance harness)
        run: cargo test --workspace --exclude modron-desktop

  build:
    name: build ${{ matrix.target }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # install.sh expects modron-<arch>-<os>.tar.gz archives containing
          # a single `modron` binary — keep names in sync with install.sh.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_os: unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_os: apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.target }}
      # -p modron-cli: ship the CLI, not the desktop crate (macOS-only gpui).
      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET" -p modron-cli
      - name: Package (modron-<arch>-<os>.tar.gz with a `modron` binary)
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p stage
          cp "target/$TARGET/release/modron" stage/modron
          ARCHIVE="modron-$TARGET.tar.gz"
          tar -czf "$ARCHIVE" -C stage modron
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          cat "$ARCHIVE.sha256"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
      - name: Create release and upload archive + per-archive sha256
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          generate_release_notes: true

  # Combined checksum manifest over the finished release's archives,
  # uploaded both as a workflow artifact and onto the release itself.
  checksums:
    name: SHA256SUMS manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download release archives
        run: |
          mkdir -p assets
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'modron-*.tar.gz' \
            --dir assets
      - name: Generate SHA256SUMS
        run: |
          cd assets
          shasum -a 256 modron-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SHA256SUMS
          path: assets/SHA256SUMS
      - name: Attach SHA256SUMS to the release
        run: gh release upload "$GITHUB_REF_NAME" assets/SHA256SUMS --clobber
