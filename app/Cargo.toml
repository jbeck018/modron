[package]
name = "modron-app"
version = "0.1.3"
edition = "2021"
license = "MIT"
publish = false

# Own workspace root: independent of the modron root workspace.
[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "modron-app-tui"
path = "src/bin/modron-app-tui.rs"

[dependencies]
nsh-core = "=0.5.1"
# No JavaScript engine (spikes/nsh-tui/RESULTS.md, Follow-up S2b).
nsh-platform-tui = { version = "=0.5.1", default-features = false, features = ["run-app"] }
ratatui = "=0.30.2"
crossterm = "=0.29.0"
tokio = { version = "1", default-features = false, features = ["sync"] }
serde_json = "1"
modron-mobile-core = { path = "../mobile/rust-core", version = "0.1.3" }
modron-view = { path = "../crates/modron-view", version = "0.1.3" }
